name: tests
on:
  push:
  pull_request:
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node run.mjs --quick
  browser:
    # the browser suites, split so the slow camera test runs alongside the rest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suites:
          - check.e2e,ai.e2e,mesh.e2e,limits.e2e,photo.e2e
          - link.e2e,show.e2e,share.e2e,isf.e2e
          - scan.e2e
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node run.mjs --only ${{ matrix.suites }}
